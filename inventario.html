<title>Cuadre de Inventario</title>

<style>
/* ============================================================
   INVENTARIO.HTML — Conteo físico contra la foto de stock
   Mismos tokens que operador.html / monitor.html (paleta acero).
   Layout: barra fija + solapas + cinta de indicadores + vistas.
   ============================================================ */

/* ---------- Tokens (claro) ---------- */
:root{
  --acero-900:#182029;
  --acero-700:#2b3742;
  --acero-500:#5a6a78;
  --acero-300:#a9b6c1;
  --acero-100:#e6ebef;
  --papel:#f4f6f8;
  --blanco:#ffffff;

  --verde:#18794e;
  --verde-suave:#e2f4ea;
  --amarillo:#9a6700;
  --amarillo-suave:#fdf3d7;
  --rojo:#c0261f;
  --rojo-suave:#fbe5e3;
  --azul:#1d4f8b;
  --azul-suave:#e4edf8;

  --radio:14px;
  --sombra:0 1px 2px rgba(24,32,41,.08), 0 8px 24px rgba(24,32,41,.06);
  --borde:1px solid var(--acero-100);
  --fuente:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
}

/* ---------- Tokens (oscuro) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --acero-900:#e7edf2;
    --acero-700:#bcc8d2;
    --acero-500:#8c9aa6;
    --acero-300:#4b5a66;
    --acero-100:#2a343d;
    --papel:#131a20;
    --blanco:#1b242c;

    --verde:#5fc08c;
    --verde-suave:#163023;
    --amarillo:#e0a93a;
    --amarillo-suave:#332714;
    --rojo:#f08279;
    --rojo-suave:#38201e;
    --azul:#7eb2e8;
    --azul-suave:#1a2a3b;

    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --acero-900:#e7edf2;
  --acero-700:#bcc8d2;
  --acero-500:#8c9aa6;
  --acero-300:#4b5a66;
  --acero-100:#2a343d;
  --papel:#131a20;
  --blanco:#1b242c;

  --verde:#5fc08c;
  --verde-suave:#163023;
  --amarillo:#e0a93a;
  --amarillo-suave:#332714;
  --rojo:#f08279;
  --rojo-suave:#38201e;
  --azul:#7eb2e8;
  --azul-suave:#1a2a3b;

  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--fuente);
  background:var(--papel);
  color:var(--acero-900);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
:focus-visible{outline:3px solid #2f6feb;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sku{font-family:var(--mono);font-size:13.5px;letter-spacing:-.2px}

/* la franja sobre el encabezado pegajoso */
body::before{
  content:"";position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top, 0px);
  z-index:30;background:var(--acero-900);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body::before{background:#0d1317} }
:root[data-theme="dark"] body::before{background:#0d1317}

/* ---------- Encabezado ---------- */
.barra{
  position:sticky;
  top:env(safe-area-inset-top, 0px);
  z-index:20;
  background:var(--acero-900);
  color:var(--papel);
}
:root[data-theme="dark"] .barra, .barra{color:#eef2f6}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .barra{background:#0d1317} }
:root[data-theme="dark"] .barra{background:#0d1317}
.barra .inner{
  max-width:1280px;margin:0 auto;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.barra h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.2px}
.barra p{margin:2px 0 0;font-size:13px;color:#9fb0bd}
.barra-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.contenedor{
  max-width:1280px;margin:0 auto;
  padding-block:18px 72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Solapas ---------- */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--acero-100);margin-bottom:18px;overflow-x:auto}
.tabs button{
  border:none;background:none;cursor:pointer;color:var(--acero-500);
  font-size:14.5px;font-weight:600;padding:10px 14px;white-space:nowrap;
  border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0;
}
.tabs button:hover{color:var(--acero-900)}
.tabs button[aria-selected="true"]{color:var(--acero-900);border-bottom-color:var(--amarillo)}
.tabs button[disabled]{opacity:.4;cursor:default}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--blanco);border:var(--borde);border-radius:var(--radio);padding:12px 14px;box-shadow:var(--sombra);min-width:0}
.kpi .valor{font-size:27px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15;word-break:break-word}
.kpi .rotulo{font-size:12.5px;color:var(--acero-500);margin-top:3px}
.kpi .pie{font-size:12px;color:var(--acero-300);margin-top:2px}
.kpi.v .valor{color:var(--verde)}
.kpi.a .valor{color:var(--amarillo)}
.kpi.r .valor{color:var(--rojo)}
.kpi.z .valor{color:var(--azul)}

/* ---------- Paneles ---------- */
.panel{background:var(--blanco);border:var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 14px;font-size:16px;font-weight:600}
.panel h2 small{font-weight:400;color:var(--acero-500);font-size:13px;margin-left:6px}
.panel > p.ayuda{margin:-8px 0 14px;font-size:13.5px;color:var(--acero-500);max-width:65ch}

/* ---------- Formulario ---------- */
label{display:block;font-size:13px;color:var(--acero-700);margin:0 0 5px}
input[type=text],input[type=number],select{
  width:100%;padding:10px 12px;border:1px solid var(--acero-300);border-radius:10px;
  font-size:15px;background:var(--blanco);color:var(--acero-900);
}
input::placeholder{color:var(--acero-300)}
.campo{margin-bottom:14px;min-width:0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}

.btn{
  border:none;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;
  cursor:pointer;background:var(--acero-900);color:var(--blanco);transition:background .12s ease;
}
.btn:hover{background:var(--acero-700)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ancho{width:100%}
.btn.chico{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.claro{background:var(--acero-100);color:var(--acero-900)}
.btn.claro:hover{background:var(--acero-300)}
.btn.peligro{background:var(--rojo-suave);color:var(--rojo)}
.btn.acento{background:var(--amarillo);color:#1a1205}
.btn.acento:hover{filter:brightness(1.08)}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Avisos ---------- */
.aviso{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px;border:1px solid transparent}
.aviso.info{background:var(--azul-suave);color:var(--azul);border-color:var(--azul)}
.aviso.mal{background:var(--rojo-suave);color:var(--rojo);border-color:var(--rojo)}
.aviso.ok{background:var(--verde-suave);color:var(--verde);border-color:var(--verde)}
.aviso.ojo{background:var(--amarillo-suave);color:var(--amarillo);border-color:var(--amarillo)}

/* ---------- Zona de carga ---------- */
.suelta{
  border:2px dashed var(--acero-300);border-radius:var(--radio);padding:28px 20px;text-align:center;
  background:var(--papel);cursor:pointer;transition:border-color .15s, background .15s;
}
.suelta:hover,.suelta.encima{border-color:var(--amarillo);background:var(--amarillo-suave)}
.suelta strong{display:block;font-size:16px;margin-bottom:4px}
.suelta span{font-size:13.5px;color:var(--acero-500)}

/* ---------- Progreso ---------- */
.barra-prog{height:9px;border-radius:99px;background:var(--acero-100);overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--verde);transition:width .25s ease}

/* ---------- Lista de inventarios ---------- */
.inv{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--acero-100);flex-wrap:wrap}
.inv:last-child{border-bottom:none}
.inv .nom{font-weight:600;min-width:0;flex:1 1 220px}
.inv .nom small{display:block;font-weight:400;color:var(--acero-500);font-size:12.5px}
.inv .prog{flex:0 0 150px;min-width:120px}
.inv .prog b{font-size:13px;font-variant-numeric:tabular-nums;display:block;margin-bottom:4px}

/* ---------- Filas de conteo ---------- */
.herram{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.herram .campo{margin-bottom:0;flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--acero-300);background:var(--blanco);color:var(--acero-700);
  border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--acero-900);color:var(--blanco);border-color:var(--acero-900)}

.filas{display:flex;flex-direction:column}
.fil{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,2.6fr) 92px 64px 120px 92px;
  gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--acero-100);
}
.fil.cab{
  font-size:12.5px;font-weight:600;color:var(--acero-500);text-transform:uppercase;
  letter-spacing:.4px;border-bottom:2px solid var(--acero-100);padding-bottom:8px;
}
.fil .desc{font-size:14px;min-width:0;overflow-wrap:anywhere}
.fil .desc small{display:block;color:var(--acero-500);font-size:12.5px}
.fil .ced{text-align:right;font-variant-numeric:tabular-nums}
.fil input{text-align:right;padding:9px 10px;font-variant-numeric:tabular-nums;font-weight:600}
.fil.contada{background:var(--verde-suave)}
.fil.difer{background:var(--rojo-suave)}
.fil.sobra{background:var(--azul-suave)}
.marca{
  display:inline-block;border-radius:7px;padding:3px 8px;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.marca.ok{background:var(--verde-suave);color:var(--verde)}
.marca.falta{background:var(--rojo-suave);color:var(--rojo)}
.marca.sobra{background:var(--azul-suave);color:var(--azul)}
.marca.nada{background:var(--acero-100);color:var(--acero-500)}

/* En el teléfono los indicadores se compactan: contar está primero. */
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .kpi{padding:9px 11px}
  .kpi .valor{font-size:21px}
  .kpi .rotulo{font-size:11.5px;margin-top:1px}
  .kpi .pie{display:none}
}

@media (max-width:860px){
  .fil.cab{display:none}
  .fil{
    grid-template-columns:1fr 120px;
    grid-template-areas:"id id" "desc desc" "sist cant" "dif cant";
    gap:6px 10px;padding:12px;border-radius:12px;border:var(--borde);margin-bottom:8px;
  }
  .fil .cid{grid-area:id}
  .fil .desc{grid-area:desc}
  .fil .csist{grid-area:sist;text-align:left}
  .fil .ccant{grid-area:cant;align-self:center}
  .fil .cdif{grid-area:dif;text-align:left}
  .fil input{font-size:17px;padding:12px 10px}
  .fil .ced.csist::before{content:"Sistema: ";color:var(--acero-500);font-weight:400}
}

/* ---------- Tablas ---------- */
.tabla-scroll{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;font-weight:600;color:var(--acero-500);font-size:12.5px;
  padding:8px 10px;border-bottom:2px solid var(--acero-100);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--acero-100);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
tbody tr:hover{background:var(--papel)}
.vacio{text-align:center;color:var(--acero-500);padding:34px 12px;font-size:14.5px}
.corte{font-size:13px;color:var(--acero-500);padding:10px 0;text-align:center}
.cambiar{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--acero-700)}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--acero-700);cursor:pointer}
.sw input{width:auto;margin:0}
</style>

<script>
/* ============================================================
   1. Utilidades
   ============================================================ */
const LOC = navigator.language && navigator.language.startsWith('es') ? navigator.language : 'es-AR';
const nf2 = new Intl.NumberFormat(LOC, {maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat(LOC, {maximumFractionDigits:0});
const fmt  = n => (n===null||n===undefined||!isFinite(n)) ? '—' : nf2.format(n);
const fmtE = n => (n===null||n===undefined||!isFinite(n)) ? '—' : nf0.format(n);
const fmtF = n => (n>0?'+':'') + fmt(n);

const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const clave = s => norm(s).replace(/[^a-z0-9]/g,'');

/** Interpreta números escritos en es-AR (1.234,56) o en inglés (1,234.56). */
function parseNum(v){
  if (v===null || v===undefined || v==='') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim().replace(/\s| /g,'').replace(/[^0-9.,\-]/g,'');
  if (!s || s==='-' ) return null;
  const neg = s.startsWith('-'); s = s.replace(/-/g,'');
  if (/^\d{1,3}(?:[.,]\d{3})+$/.test(s)) {           // 1.234.567 → miles
    s = s.replace(/[.,]/g,'');
  } else if (s.includes('.') && s.includes(',')) {   // el separador de la derecha decide
    const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ',';
    const mil = dec === '.' ? ',' : '.';
    s = s.split(mil).join('').replace(dec,'.');
  } else {
    s = s.replace(',', '.');
    const p = s.split('.');
    if (p.length > 2) s = p.slice(0,-1).join('') + '.' + p[p.length-1];
  }
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : null;
}

/** El formato numérico se decide mirando TODA la columna, no cada valor:
 *  "420,000" solo/a es ambiguo (420 en es-AR, 420000 en inglés). */
function detectarConvencion(vals){
  let es=0, en=0, tresP=0, tresC=0;
  for (const v of vals){
    if (typeof v !== 'string') continue;
    const s = v.replace(/\s|\u00a0/g,'').replace(/[^0-9.,\-]/g,'');
    if (!s) continue;
    const hayP = s.includes('.'), hayC = s.includes(',');
    if (hayP && hayC){
      if (s.lastIndexOf('.') > s.lastIndexOf(',')) en += 3; else es += 3;
    } else if (hayP){
      const t = s.split('.');
      if (t.length > 2) es += 2;                                   // 1.234.567 → punto = miles
      else if (t[1] !== undefined && t[1].length !== 3) en += 2;   // 1.5 → punto = decimal
      else tresP++;                                                // 1.250 → sin evidencia aún
    } else if (hayC){
      const t = s.split(',');
      if (t.length > 2) en += 2;                                   // 1,234,567 → coma = miles
      else if (t[1] !== undefined && t[1].length !== 3) es += 2;   // 1,5 → coma = decimal
      else tresC++;                                                // 1,250 → sin evidencia aún
    }
  }
  if (en === es){
    // Sin evidencia directa: los separadores de miles siempre agrupan de
    // 3 en 3, mientras que los decimales varían de largo.
    if (tresC > tresP) return 'en';
    if (tresP > tresC) return 'es';
  }
  return en > es ? 'en' : 'es';
}

/** Interpreta un valor con una convención ya decidida (sin adivinar). */
function parseConv(v, conv){
  if (v===null || v===undefined || v==='') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim().replace(/\s|\u00a0/g,'').replace(/[^0-9.,\-]/g,'');
  if (!s || s==='-') return null;
  const neg = s.startsWith('-'); s = s.replace(/-/g,'');
  const dec = conv==='en' ? '.' : ',', mil = conv==='en' ? ',' : '.';
  s = s.split(mil).join('');
  const i = s.lastIndexOf(dec);
  if (i >= 0) s = s.slice(0,i) + '.' + s.slice(i+1).replace(/[.,]/g,'');
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : null;
}

const el = id => document.getElementById(id);
function nodo(tag, cls, txt){ const n=document.createElement(tag); if(cls)n.className=cls; if(txt!==undefined)n.textContent=txt; return n; }
function limpiar(n){ while(n.firstChild) n.removeChild(n.firstChild); return n; }

function avisar(msg, tipo){
  const a = el('aviso');
  if (!msg){ a.hidden = true; return; }
  a.className = 'aviso ' + (tipo || 'info');
  a.textContent = msg;
  a.hidden = false;
}

/* ============================================================
   2. Estado
   ============================================================ */
let DB=null, USR=null, DESC=null;          // capacidades
let uid=null, miNombre='', puedeEscribir=null;
let sesiones=[];                            // metadatos de cada inventario
let sid=null, meta=null;                    // inventario abierto
let cat=[];                                 // catálogo: filas de la foto de stock
let conteos=new Map();                      // idx → {cant, nota, por, ts}
let extras=new Map();                       // id  → hallazgo sin catalogar
let unsubSes=null, unsubCont=null, unsubMeta=null;
let vista='inicio';
let pend=null;                              // archivo en proceso de mapeo
let filtro='todas', busq='', agrupar='linea', soloDif='todas';
const TOPE_FILAS=250, TOPE_TABLA=400, TAM_BLOQUE=400;

const CAMPOS = [
  {k:'sku',   et:'Código / SKU',        req:true,  pistas:['sku','codigo','cod','material','articulo','item','referencia','clave','ean','upc','nroarticulo','codprod']},
  {k:'desc',  et:'Descripción',         req:false, pistas:['descripcion','desc','detalle','nombre','producto','denominacion','textobreve','descrip']},
  {k:'ubic',  et:'Ubicación',           req:false, pistas:['ubicacion','ubic','loc','location','bin','posicion','rack','pasillo','estante','almacen','deposito','bodega','zona','sector']},
  {k:'um',    et:'Unidad de medida',    req:false, pistas:['um','unidad','uom','medida','unidadmedida','unimed']},
  {k:'sist',  et:'Stock del sistema',   req:true,  pistas:['stock','existencia','cantidad','disponible','saldo','libreutilizacion','onhand','qty','cant','teorico','sistema','exist','saldofinal']},
  {k:'costo', et:'Costo unitario',      req:false, pistas:['costo','coste','preciounitario','precio','valorunitario','costounitario','costostd','importeunitario']},
  {k:'lote',  et:'Lote / partida',      req:false, pistas:['lote','batch','partida','serie']},
];

/* ============================================================
   3. Arranque — las capacidades llegan después del primer pintado
   ============================================================ */
pintarInicio();
pintarBarra();

let listo=false;
const reloj = setTimeout(()=>{ if(!listo) avisar('No se pudo contactar el almacenamiento. Podés cargar un Excel y trabajar, pero los conteos no se van a guardar.', 'ojo'); }, 10000);

/** Fuera del visor de artefactos `window.claude` puede no existir. */
const usar = n => {
  try { return (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null); }
  catch(e){ return Promise.resolve(null); }
};

(async function arrancar(){
  DESC = await usar('downloads');
  USR  = await usar('user');
  if (USR){
    try { uid = await USR.id(); } catch(e){ uid = null; }
    try { const yo = await USR.me(); miNombre = (yo && yo.name) || ''; } catch(e){}
    try { puedeEscribir = await USR.can('data.write'); } catch(e){ puedeEscribir = null; }
  }
  DB = await usar('db');
  if (!DB){
    listo=true; clearTimeout(reloj);
    avisar('Este visor no guarda datos. Podés cargar un Excel y contar, pero al cerrar la página se pierde el conteo.', 'ojo');
    return;
  }
  if (puedeEscribir === false) avisar('Tenés acceso de sólo lectura: podés ver los conteos pero no modificarlos.', 'info');
  unsubSes = DB.collection('inventarios').orderBy('creado','desc').limit(100).onSnapshot(s=>{
    listo=true; clearTimeout(reloj);
    if (!s.metadata.fromCache) avisar('');
    sesiones = s.docs.map(d=>Object.assign({id:d.id}, d.data()));

    pintarBarra();
  }, e=>{

  });
})();

/* ============================================================
   4. Cola de escritura — un write a la vez por documento
   ============================================================ */
const colas = new Map();
function encolar(ref, fn){
  const prev = colas.get(ref.path) || Promise.resolve();
  const sig = prev.catch(()=>{}).then(fn);
  colas.set(ref.path, sig.catch(()=>{}));
  return sig;
}

/* ============================================================
   7. Lectura del Excel y detección de columnas
   ============================================================ */
function leerArchivo(file){
  avisar('Leyendo ' + file.name + '…', 'info');
  const fr = new FileReader();
  fr.onerror = ()=>avisar('No se pudo leer el archivo.', 'mal');
  fr.onload = ()=>{
    let wb;
    try {
      wb = XLSX.read(new Uint8Array(fr.result), {type:'array', cellDates:true});
    } catch(e){
      avisar('El archivo no se pudo interpretar como Excel ni CSV.', 'mal'); return;
    }
    if (!wb.SheetNames.length){ avisar('El archivo no tiene hojas.', 'mal'); return; }
    pend = {nombreArch:file.name, wb, hoja:wb.SheetNames[0]};
    cargarHoja();
    avisar('');
    ir('mapeo');
  };
  fr.readAsArrayBuffer(file);
}

function cargarHoja(){
  const ws = pend.wb.Sheets[pend.hoja];
  const filas = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:false});
  pend.filas = filas;
  pend.cab = detectarCabecera(filas);
  pend.mapa = detectarColumnas(filas[pend.cab] || []);
  pend.conv = null;
  pintarMapeo();
}

/** La cabecera es la fila de las primeras 15 con más celdas de texto que coinciden con nombres conocidos. */
function detectarCabecera(filas){
  let mejor=0, puntos=-1;
  for (let i=0; i<Math.min(15, filas.length); i++){
    const f = filas[i] || [];
    let p = 0;
    f.forEach(c=>{
      if (typeof c !== 'string' || !c.trim()) return;
      p += 1;
      const k = clave(c);
      for (const campo of CAMPOS) if (campo.pistas.some(h=>k.includes(h))) { p += 4; break; }
    });
    if (p > puntos){ puntos = p; mejor = i; }
  }
  return mejor;
}

function detectarColumnas(cab){
  const m = {};
  const usadas = new Set();
  const puntaje = (txt, campo) => {
    const k = clave(txt);
    if (!k) return 0;
    let mx = 0;
    campo.pistas.forEach(h=>{
      if (k === h) mx = Math.max(mx, 100);
      else if (k.startsWith(h) || k.endsWith(h)) mx = Math.max(mx, 60);
      else if (k.includes(h)) mx = Math.max(mx, 40);
    });
    return mx;
  };
  CAMPOS.forEach(campo=>{
    let mejor=-1, pts=0;
    cab.forEach((txt,j)=>{
      if (usadas.has(j)) return;
      const p = puntaje(txt, campo);
      if (p > pts){ pts = p; mejor = j; }
    });
    if (mejor>=0 && pts>=40){ m[campo.k] = mejor; usadas.add(mejor); }
  });
  return m;
}

function sugerirNombre(){
  const d = new Date();
  const base = (pend.nombreArch||'stock').replace(/\.[^.]+$/,'').slice(0,40);
  return base + ' · ' + d.toLocaleDateString(LOC);
}

/** Aplica el mapeo y devuelve sólo las líneas con código y stock legibles. */
function filasValidas(){
  const m = pend.mapa;
  if (m.sku===undefined || m.sist===undefined) return [];
  if (!pend.conv){
    const muestra = [];
    for (let i=pend.cab+1; i<pend.filas.length; i++){
      const f = pend.filas[i] || [];
      if (f[m.sist]!==null && f[m.sist]!==undefined) muestra.push(f[m.sist]);
      if (m.costo!==undefined && f[m.costo]!==null && f[m.costo]!==undefined) muestra.push(f[m.costo]);
    }
    pend.conv = detectarConvencion(muestra);
  }
  const cv = pend.conv;
  const out = [];
  for (let i=pend.cab+1; i<pend.filas.length; i++){
    const f = pend.filas[i] || [];
    const sku = f[m.sku];
    if (sku===null || sku===undefined || String(sku).trim()==='') continue;
    const sist = parseConv(f[m.sist], cv);
    if (sist===null) continue;
    const txt = j => (j===undefined || f[j]===null || f[j]===undefined) ? '' : String(f[j]).trim();
    out.push({
      sku: String(sku).trim(),
      desc: txt(m.desc), ubic: txt(m.ubic), um: txt(m.um), lote: txt(m.lote),
      sist,
      costo: m.costo===undefined ? null : parseConv(f[m.costo], cv)
    });
  }
  return out;
}

/* ============================================================
   8. Crear / abrir / cerrar / borrar inventario
   ============================================================ */
function idNuevo(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

async function crearSesion(filas){
  if (!DB){ avisar('Sin almacenamiento no se puede crear el inventario. Igual podés cargar el archivo y contar, pero no se guarda.', 'mal'); return; }
  if (puedeEscribir === false){ avisar('No tenés permiso para crear inventarios en este artefacto.', 'mal'); return; }
  const nid = idNuevo();
  const nombre = (el('nomInv') && el('nomInv').value.trim()) || sugerirNombre();
  const ciego = !(el('ciego') && el('ciego').checked === false);
  const bloques = Math.ceil(filas.length / TAM_BLOQUE);
  if (filas.length > 9000) avisar('Son ' + fmtE(filas.length) + ' líneas: el guardado va a tardar y la pantalla de conteo puede ponerse lenta. Conviene dividir el conteo por depósito o por familia.', 'ojo');

  const prog = nodo('div','panel');
  prog.appendChild(nodo('h2','','Guardando el inventario'));
  const bp = nodo('div','barra-prog'); const ind = nodo('i'); ind.style.width='0%'; bp.appendChild(ind);
  prog.appendChild(bp);
  const txt = nodo('p','ayuda','Preparando…'); txt.style.margin='10px 0 0';
  prog.appendChild(txt);
  limpiar(el('vMapeo')).appendChild(prog);

  try {
    for (let b=0; b<bloques; b++){
      const trozo = filas.slice(b*TAM_BLOQUE, (b+1)*TAM_BLOQUE);
      await DB.doc('inventarios/' + nid + '/catalogo/' + b).set({
        n: b, desde: b*TAM_BLOQUE,
        filas: trozo.map(f=>[f.sku, f.desc, f.ubic, f.um, f.sist, f.costo, f.lote])
      });
      ind.style.width = Math.round((b+1)/bloques*100) + '%';
      txt.textContent = 'Bloque ' + (b+1) + ' de ' + bloques + ' · ' + fmtE(Math.min(filas.length,(b+1)*TAM_BLOQUE)) + ' líneas';
    }
    await DB.doc('inventarios/' + nid).set({
      nombre, creado: Date.now(), archivo: pend ? pend.nombreArch : '—', hoja: pend ? pend.hoja : '',
      totalFilas: filas.length, bloques, ciego, cerrado:false, contadas:0,
      conCosto: filas.some(f=>f.costo!==null),
      creadoPor: miNombre || '', creadoPorId: uid || ''
    });
  } catch(e){
    avisar('No se pudo guardar el inventario (' + (e.code||'error') + '). ' + (e.code==='quota_exceeded' ? 'Borrá algún inventario viejo para liberar espacio.' : ''), 'mal');
    pintarMapeo(); return;
  }
  pend = null;
  await abrirSesion(nid);
}

async function abrirSesion(id){
  cerrarSesion();
  sid = id;
  meta = sesiones.find(s=>s.id===id) || null;
  avisar('Cargando el inventario…', 'info');
  try {
    const snap = await DB.collection('inventarios/' + id + '/catalogo').get();
    const bl = snap.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>(a.n||0)-(b.n||0));
    cat = [];
    bl.forEach(b=>{
      (b.filas||[]).forEach(r=>{
        cat.push({i:cat.length, sku:r[0]||'', desc:r[1]||'', ubic:r[2]||'', um:r[3]||'', sist:(typeof r[4]==='number'?r[4]:parseNum(r[4])), costo:(typeof r[5]==='number'?r[5]:null), lote:r[6]||''});
      });
    });
  } catch(e){
    avisar('No se pudo leer el catálogo de este inventario (' + (e.code||'error') + ').', 'mal');
    sid=null; return;
  }
  avisar('');
  unsubMeta = DB.doc('inventarios/' + id).onSnapshot(s=>{
    if (s.exists){ meta = Object.assign({id}, s.data()); pintarBarra(); }
  }, ()=>{});
  unsubCont = DB.collection('inventarios/' + id + '/conteos').onSnapshot(s=>{
    conteos = new Map(); extras = new Map();
    s.docs.forEach(d=>{
      const x = d.data(); if (!x) return;
      if (x.extra) extras.set(d.id, Object.assign({id:d.id}, x));
      else conteos.set(Number(x.idx), x);
    });
    pintarKpis();
    if (vista==='contar') refrescarFilas();
    if (vista==='dif') pintarDif();
  }, e=>avisar('Se perdió la conexión con los conteos (' + e.code + '). Recargá la página.', 'mal'));
  pintarBarra();
  ir('contar');
}

function cerrarSesion(){
  if (unsubCont) unsubCont(); if (unsubMeta) unsubMeta();
  unsubCont = unsubMeta = null;
  sid = null; meta = null; cat = []; conteos = new Map(); extras = new Map();
  busq=''; filtro='todas';
  pintarBarra();
}

async function borrarSesion(s){
  if (!confirmar('¿Borrar "' + (s.nombre||s.id) + '" con todos sus conteos? No se puede deshacer.')) return;
  avisar('Borrando "' + (s.nombre||s.id) + '"…', 'info');
  try {
    const cs = await DB.collection('inventarios/' + s.id + '/conteos').get();
    for (const d of cs.docs) await DB.doc('inventarios/' + s.id + '/conteos/' + d.id).delete();
    const bs = await DB.collection('inventarios/' + s.id + '/catalogo').get();
    for (const d of bs.docs) await DB.doc('inventarios/' + s.id + '/catalogo/' + d.id).delete();
    await DB.doc('inventarios/' + s.id).delete();
    if (sid === s.id) cerrarSesion();
    avisar('Inventario borrado.', 'ok');

  } catch(e){
    avisar('No se pudo borrar del todo (' + (e.code||'error') + ').', 'mal');
  }
  ir('inicio');
}

/** El visor no muestra confirm(): uso una confirmación propia de dos pasos. */
let confirmando = null;
function confirmar(msg){
  if (confirmando === msg){ confirmando = null; return true; }
  confirmando = msg;
  avisar(msg + ' — volvé a tocar el botón para confirmar.', 'ojo');
  setTimeout(()=>{ if (confirmando === msg){ confirmando = null; avisar(''); } }, 6000);
  return false;
}

/* ============================================================
   9. Indicadores
   ============================================================ */
function calcular(){
  let contadas=0, exactas=0, difU=0, difVal=0, difAbsVal=0, faltU=0, sobU=0, faltVal=0, sobVal=0, conDif=0;
  cat.forEach(f=>{
    const c = conteos.get(f.i);
    if (!c || c.cant===null || c.cant===undefined) return;
    contadas++;
    const d = c.cant - f.sist;
    const val = (f.costo||0) * d;
    difU += d; difVal += val; difAbsVal += Math.abs(val);
    if (d===0) exactas++; else conDif++;
    if (d<0){ faltU += d; faltVal += val; } else if (d>0){ sobU += d; sobVal += val; }
  });
  let extraU=0, extraVal=0;
  extras.forEach(x=>{ extraU += (x.cant||0); extraVal += (x.cant||0)*(x.costo||0); });
  return {total:cat.length, contadas, exactas, conDif, difU, difVal, difAbsVal, faltU, sobU, faltVal, sobVal,
          eri: contadas ? exactas/contadas*100 : null, avance: cat.length ? contadas/cat.length*100 : 0,
          extraU, extraVal, nExtras: extras.size};
}

  caja(k.conDif ? 'a' : 'v', fmtE(k.conDif), 'Líneas con diferencia', fmtE(k.exactas) + ' coinciden exacto');
  caja(k.difU===0 ? '' : (k.difU<0?'r':'z'), fmtF(k.difU), 'Diferencia neta (unid.)', fmtF(k.faltU) + ' faltante / ' + fmtF(k.sobU) + ' sobrante');
  if (meta && meta.conCosto){

  }
  if (k.nExtras) caja('z', fmtE(k.nExtras), 'Hallazgos sin catalogar', fmtF(k.extraU) + ' unidades encontradas');

function visibles(){
  const q = norm(busq);
  const out = [];
  for (const f of cat){
    if (q){
      const h = norm(f.sku) + ' ' + norm(f.desc) + ' ' + norm(f.ubic) + ' ' + norm(f.lote);
      if (!h.includes(q)) continue;
    }
    const c = conteos.get(f.i);
    const hecha = !!(c && c.cant!==null && c.cant!==undefined);
    if (filtro==='pend' && hecha) continue;
    if (filtro==='hechas' && !hecha) continue;
    if (filtro==='dif' && (!hecha || c.cant===f.sist)) continue;
    out.push(f);
  }
  return out;
}

function refrescarFilas(){
  const cont = el('filas'); if (!cont) return;
  // Mientras alguien está tipeando no se reconstruye la lista: sólo se
  // actualizan los indicadores, para no perder el foco ni el cursor.
  const foco = document.activeElement;
  if (foco && foco.tagName==='INPUT' && cont.contains(foco)){ actualizarMarcas(cont, foco); return; }
  const lista = visibles();
  limpiar(cont);
  const ciego = !!(meta && meta.ciego);
  const bloqueado = puedeEscribir === false || (meta && meta.cerrado);

  lista.slice(0,TOPE_FILAS).forEach(f=>{
    const c = conteos.get(f.i);
    const hecha = !!(c && c.cant!==null && c.cant!==undefined);
    const d = hecha ? c.cant - f.sist : null;
    const r = nodo('div','fil' + (hecha ? (d===0 ? ' contada' : (d<0 ? ' difer' : ' sobra')) : ''));
    r.dataset.i = f.i;

    const cid = nodo('div','cid'); cid.appendChild(nodo('span','sku', f.sku));
    r.appendChild(cid);

    const de = nodo('div','desc', f.desc || '(sin descripción)');
    const sub = [f.ubic && ('Ubic. ' + f.ubic), f.lote && ('Lote ' + f.lote)].filter(Boolean).join(' · ');
    if (sub) de.appendChild(nodo('small','', sub));
    r.appendChild(de);

    r.appendChild(nodo('div','ced csist', ciego ? '' : fmt(f.sist)));
    r.appendChild(nodo('div','ced', f.um || ''));

    const cc = nodo('div','ccant');
    const inp = document.createElement('input');
    inp.type='text'; inp.inputMode='decimal'; inp.autocomplete='off';
    inp.value = hecha ? nf2.format(c.cant) : '';
    inp.placeholder = '—';
    inp.setAttribute('aria-label','Cantidad contada de ' + f.sku);
    inp.disabled = !!bloqueado;
    inp.oninput = ()=>guardarConteo(f, inp.value);
    inp.onkeydown = e=>{
      if (e.key==='Enter'){
        e.preventDefault();
        const todos = Array.prototype.slice.call(document.querySelectorAll('#filas input'));
        const k = todos.indexOf(inp);
        if (k>=0 && todos[k+1]) todos[k+1].focus();
        else inp.blur();
      }
    };
    // al salir del campo se muestra la cantidad tal como quedó registrada
    inp.onblur = ()=>{
      const t = inp.value.trim();
      if (t===''){ return; }
      const n = parseNum(t);
      if (n===null){ avisar('No se entendió "' + t + '" como cantidad en ' + f.sku + '.', 'mal'); return; }
      inp.value = nf2.format(n);
    };
    cc.appendChild(inp); r.appendChild(cc);

    const cd = nodo('div','cdif');
    if (!hecha) cd.appendChild(nodo('span','marca nada','sin contar'));
    else if (d===0) cd.appendChild(nodo('span','marca ok','exacto'));
    else cd.appendChild(nodo('span','marca ' + (d<0?'falta':'sobra'), fmtF(d)));
    r.appendChild(cd);

    cont.appendChild(r);
  });

  const corte = el('corte');
  if (!lista.length){
    corte.textContent = '';
    cont.appendChild(nodo('p','vacio', busq || filtro!=='todas' ? 'Ninguna línea coincide con el filtro.' : 'Este inventario no tiene líneas.'));
  } else if (lista.length > TOPE_FILAS){
    corte.textContent = 'Mostrando ' + TOPE_FILAS + ' de ' + fmtE(lista.length) + ' líneas. Afiná la búsqueda para llegar al resto.';
  } else {
    corte.textContent = fmtE(lista.length) + (lista.length===1 ? ' línea' : ' líneas');
  }
}

/** Refresca clases e indicadores sin tocar el campo que está en uso. */
function actualizarMarcas(cont, foco){
  Array.prototype.forEach.call(cont.children, r=>{
    const i = Number(r.dataset.i);
    const f = cat[i]; if (!f) return;
    const c = conteos.get(i);
    const hecha = !!(c && c.cant!==null && c.cant!==undefined);
    const d = hecha ? c.cant - f.sist : null;
    r.className = 'fil' + (hecha ? (d===0 ? ' contada' : (d<0 ? ' difer' : ' sobra')) : '');
    const cd = r.querySelector('.cdif');
    if (cd){
      limpiar(cd);
      if (!hecha) cd.appendChild(nodo('span','marca nada','sin contar'));
      else if (d===0) cd.appendChild(nodo('span','marca ok','exacto'));
      else cd.appendChild(nodo('span','marca ' + (d<0?'falta':'sobra'), fmtF(d)));
    }
    const inp = r.querySelector('input');
    if (inp && inp !== foco){
      const v = hecha ? nf2.format(c.cant) : '';
      if (inp.value !== v) inp.value = v;
    }
  });
}

const esperas = new Map();
function guardarConteo(f, texto){
  if (!DB) return;
  clearTimeout(esperas.get(f.i));
  esperas.set(f.i, setTimeout(()=>{
    const ref = DB.doc('inventarios/' + sid + '/conteos/' + f.i);
    const t = String(texto).trim();
    const cant = t==='' ? null : parseNum(t);
    if (t!=='' && cant===null) return;              // texto a medio escribir: no toco nada
    encolar(ref, ()=>{
      if (cant===null) return ref.delete();
      return ref.set({idx:f.i, sku:f.sku, cant, por: miNombre||'', porId: uid||'', ts: Date.now()});
    }).then(actualizarAvance).catch(e=>{
      avisar('No se pudo guardar el conteo de ' + f.sku + ' (' + (e.code||'error') + ').', 'mal');
    });
  }, 450));
}

/* ============================================================
   11. Vista: diferencias
   ============================================================ */
function informe(){
  // Una línea por fila del catálogo, o agrupado por SKU.
  const base = [];
  cat.forEach(f=>{
    const c = conteos.get(f.i);
    const hecha = !!(c && c.cant!==null && c.cant!==undefined);
    base.push({
      sku:f.sku, desc:f.desc, ubic:f.ubic, um:f.um, lote:f.lote,
      sist:f.sist, cant: hecha ? c.cant : null, costo:f.costo,
      dif: hecha ? c.cant - f.sist : null,
      val: hecha && f.costo!==null ? (c.cant - f.sist) * f.costo : null,
      por: hecha ? (c.por||'') : '', hecha, extra:false
    });
  });
  extras.forEach(x=>{
    base.push({sku:x.sku, desc:x.desc||'', ubic:x.ubic||'', um:'', lote:'', sist:0, cant:x.cant, costo:x.costo??null,
               dif:x.cant, val: x.costo!==null&&x.costo!==undefined ? x.cant*x.costo : null, por:x.por||'', hecha:true, extra:true});
  });

  let filas = base;
  if (agrupar==='sku'){
    const m = new Map();
    base.forEach(r=>{
      let a = m.get(r.sku);
      if (!a){ a = {sku:r.sku, desc:r.desc, ubic:'', um:r.um, lote:'', sist:0, cant:null, costo:r.costo, dif:null, val:null, por:r.por, hecha:false, extra:r.extra, lineas:0, ubics:new Set()}; m.set(r.sku, a); }
      a.sist += r.sist; a.lineas++;
      if (r.ubic) a.ubics.add(r.ubic);
      if (r.hecha){ a.hecha = true; a.cant = (a.cant||0) + r.cant; }
      if (!a.desc && r.desc) a.desc = r.desc;
      if (a.costo===null && r.costo!==null) a.costo = r.costo;
    });
    filas = Array.from(m.values()).map(a=>{
      a.ubic = a.ubics.size===1 ? Array.from(a.ubics)[0] : (a.ubics.size ? a.ubics.size + ' ubic.' : '');
      delete a.ubics;
      a.dif = a.hecha ? a.cant - a.sist : null;
      a.val = a.hecha && a.costo!==null ? a.dif * a.costo : null;
      return a;
    });
  }

  if (soloDif==='dif')      filas = filas.filter(r=>r.hecha && r.dif!==0);
  else if (soloDif==='falta') filas = filas.filter(r=>r.hecha && r.dif<0);
  else if (soloDif==='sobra') filas = filas.filter(r=>r.hecha && r.dif>0);
  else if (soloDif==='sin')   filas = filas.filter(r=>!r.hecha);

  filas.sort((a,b)=>{
    const va = a.val===null ? -1 : Math.abs(a.val), vb = b.val===null ? -1 : Math.abs(b.val);
    if (vb !== va) return vb - va;
    return Math.abs(b.dif||0) - Math.abs(a.dif||0);
  });
  return filas;
}

  t.appendChild(tb); sc.appendChild(t); p.appendChild(sc);
  if (filas.length > TOPE_TABLA) p.appendChild(nodo('p','corte','Mostrando las ' + TOPE_TABLA + ' líneas de mayor impacto, de ' + fmtE(filas.length) + '. La descarga trae todas.'));
  else p.appendChild(nodo('p','corte', fmtE(filas.length) + (filas.length===1?' línea':' líneas')));
  v.appendChild(p);

  // lectura del cuadre
  const q = nodo('div','panel');
  q.appendChild(nodo('h2','','Lectura del cuadre'));
  const ul = document.createElement('ul'); ul.style.margin='0'; ul.style.paddingLeft='20px'; ul.style.fontSize='14.5px';
  const li = t2 => { const l=document.createElement('li'); l.textContent=t2; l.style.marginBottom='6px'; ul.appendChild(l); };
  li('Avance: ' + fmtE(k.contadas) + ' de ' + fmtE(k.total) + ' líneas (' + Math.round(k.avance) + '%). Quedan ' + fmtE(k.total-k.contadas) + ' sin contar.');
  li('Exactitud sobre lo contado: ' + (k.eri===null?'—':fmt(k.eri)+'%') + ' — ' + fmtE(k.exactas) + ' líneas coinciden exacto y ' + fmtE(k.conDif) + ' no.');
  li('Faltantes ' + fmt(Math.abs(k.faltU)) + ' unidades, sobrantes ' + fmt(k.sobU) + ' unidades. Neto ' + fmtF(k.difU) + '.');
  if (meta && meta.conCosto) li('Valor: neto ' + fmtF(k.difVal) + ', exposición total ' + fmt(k.difAbsVal) + ' (suma de diferencias en valor absoluto, que es lo que mide el error real del registro).');
  if (k.nExtras) li(fmtE(k.nExtras) + ' hallazgos sin catalogar por ' + fmt(k.extraU) + ' unidades: hay que darlos de alta en el sistema.');
  q.appendChild(ul);
  v.appendChild(q);
}

/* ============================================================
   12. Exportación
   ============================================================ */
function nombreArchivo(ext){
  const base = ((meta && meta.nombre) || 'cuadre').replace(/[^\p{L}\p{N} ._-]/gu,'').trim().slice(0,60) || 'cuadre';
  const d = new Date();
  const p2 = n=>String(n).padStart(2,'0');
  return base + ' ' + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + '.' + ext;
}

function matriz(filas){
  const conCosto = !!(meta && meta.conCosto);
  const cab = ['Codigo','Descripcion','Ubicacion','UM','Lote','Stock sistema','Contado','Dif unidades','Dif %'];
  if (conCosto) cab.push('Costo unitario','Dif valorizada');
  cab.push('Estado','Contado por');
  const cuerpo = filas.map(r=>{
    const est = !r.hecha ? 'Sin contar' : r.extra ? 'Sin catalogar' : r.dif===0 ? 'Exacto' : r.dif<0 ? 'Faltante' : 'Sobrante';
    const fila = [r.sku, r.desc||'', r.ubic||'', r.um||'', r.lote||'',
      r.sist, r.hecha?r.cant:null, r.hecha?r.dif:null,
      r.hecha && r.sist ? +(r.dif/r.sist*100).toFixed(2) : null];
    if (conCosto) fila.push(r.costo===null?null:r.costo, r.val===null?null:+r.val.toFixed(2));
    fila.push(est, r.por||'');
    return fila;
  });
  return [cab].concat(cuerpo);
}

async function exportar(filas, formato){
  if (!DESC){ avisar('Este visor no permite descargar archivos.', 'mal'); return; }
  const datos = matriz(filas);
  const k = calcular();
  try {
    if (formato==='csv'){
      const esc = x => {
        if (x===null || x===undefined) return '';
        const s = typeof x === 'number' ? String(x).replace('.', ',') : String(x);
        return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
      };
      const csv = '﻿' + datos.map(f=>f.map(esc).join(';')).join('\r\n');
      await DESC.save({filename: nombreArchivo('csv'), data: csv});
    } else {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(datos);
      ws['!cols'] = [{wch:16},{wch:38},{wch:14},{wch:7},{wch:12},{wch:13},{wch:11},{wch:12},{wch:9},{wch:13},{wch:14},{wch:12},{wch:16}];
      XLSX.utils.book_append_sheet(wb, ws, 'Diferencias');
      const res = [
        ['Inventario', (meta&&meta.nombre)||''],
        ['Archivo origen', (meta&&meta.archivo)||''],
        ['Generado', new Date().toLocaleString(LOC)],
        [],
        ['Lineas de la foto de stock', k.total],
        ['Lineas contadas', k.contadas],
        ['Avance %', +k.avance.toFixed(2)],
        ['Lineas exactas', k.exactas],
        ['Lineas con diferencia', k.conDif],
        ['Exactitud ERI %', k.eri===null?null:+k.eri.toFixed(2)],
        ['Faltante en unidades', k.faltU],
        ['Sobrante en unidades', k.sobU],
        ['Diferencia neta en unidades', k.difU],
      ];
      if (meta && meta.conCosto) res.push(['Diferencia neta valorizada', +k.difVal.toFixed(2)], ['Exposicion (valor absoluto)', +k.difAbsVal.toFixed(2)]);
      if (k.nExtras) res.push(['Hallazgos sin catalogar', k.nExtras], ['Unidades sin catalogar', k.extraU]);
      const wr = XLSX.utils.aoa_to_sheet(res);
      wr['!cols'] = [{wch:32},{wch:22}];
      XLSX.utils.book_append_sheet(wb, wr, 'Resumen');
      const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
      await DESC.save({filename: nombreArchivo('xlsx'), data: new Blob([buf])});
    }
    avisar('Archivo listo.', 'ok'); setTimeout(()=>avisar(''), 3000);
  } catch(e){
    if (e && e.code==='declined'){ avisar(''); return; }
    avisar('No se pudo generar la descarga (' + ((e&&e.code)||'error') + ').', 'mal');
  }
}
